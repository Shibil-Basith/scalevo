<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="description" content="Scalevo is a focused DevOps learning workspace for session recordings and syllabus progress." />
    <title>Scalevo · DevOps learning workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Manrope", "ui-sans-serif", "system-ui", "sans-serif"] },

              card: "0 18px 50px -28px rgba(15, 23, 42, .34)",
              float: "0 26px 70px -28px rgba(15, 23, 42, .48)",

          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root { color-scheme: light; --ink: #172033; --muted: #66728a; --line: rgba(203, 213, 225, .78); --blue: #3568f5; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { min-width: 320px; margin: 0; background: #f6f8fc; color: var(--ink); font-family: Manrope, ui-sans-serif, system-ui, sans-serif; }
      .display { font-family: "Space Grotesk", Manrope, ui-sans-serif, system-ui, sans-serif; }
      .shell-bg { background: radial-gradient(circle at 8% -8%, rgba(191, 219, 254, .42), transparent 28rem), radial-gradient(circle at 94% 0%, rgba(224, 231, 255, .48), transparent 30rem); }
      .glass { background: rgba(255, 255, 255, .78); border: 1px solid var(--line); box-shadow: 0 18px 50px -28px rgba(15, 23, 42, .34); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
      .card { transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
      .card:hover { transform: translateY(-4px); border-color: rgba(148, 163, 184, .95); box-shadow: 0 26px 70px -28px rgba(15, 23, 42, .38); }
      .lesson-row { transition: background .18s ease, border-color .18s ease, transform .18s ease; }
      .lesson-row:hover { transform: translateX(3px); border-color: rgba(96, 165, 250, .55); background: #f8fbff; }
      .focus-ring:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid rgba(59, 130, 246, .34); outline-offset: 3px; }
      .progress-bar { transition: width .35s ease; }
      .modal-backdrop { background: rgba(15, 23, 42, .64); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
      .video-frame { aspect-ratio: 16 / 9; background: #0b1220; }
      .brand-wordmark { letter-spacing: -.045em; }
      @media (max-width: 640px) {
        body { font-size: 14px; }
        .glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .lesson-row { align-items: flex-start; }
        .lesson-row button[data-play] { padding-inline: .65rem; }
      }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <div id="app" class="min-h-screen shell-bg"></div>
    <div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-50 hidden -translate-x-1/2 rounded-full bg-slate-950 px-4 py-2.5 text-xs font-semibold text-white shadow-xl"></div>

    <script>
      const file = (title, id) => ({ title, id, ready: true });
      const pending = (title) => ({ title, ready: false });

      let modules = [
        {
          id: "linux", number: "03", category: "Core OS", title: "Linux Fundamentals", accent: "#f59e0b", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/linux/linux-original.svg",
          description: "Build a dependable command-line foundation, from files and permissions to processes, shell scripts, and remote access.",
          lessons: [
            file("Echo and cat", "18WEPIkSohsxvBVyHnlhpLwP_Eu2X65Rn"), file("Grep and find commands", "1fTvbFHp_tngKiLiM-yZit-t-V7R5h72o"), file("Linux permissions and ownerships", "1Ac5YPxWfcJagAS5Za6Ju1yEFHVr500ca"), file("Linux special permissions", "1y1YcyEpo4i1SuEi8ZJYo20LtelTTn1Js"), file("Logs and troubleshooting", "1mvVTL6SxlexTOmoAnPtgDOEdbfwhUu7M"), file("Managing services with systemctl", "1C-xnCej8p5CtQ5UqYORQGK2l-ADLFL04"), file("Package manager", "1hs47zKpiScbhQtiQp6h60VX8ipmwK6L3"), file("Process management", "13-dzmGF0_ujpnIatnKsAMsPLDpbYVQkj"), file("Shell scripting and cron jobs", "1eJTnczdgvXCinLDeCrxfS1anAnZVa9W7"), file("SSH and SCP", "1JMLCEm28QWtHM2xA93uf1XTQjzohsJkZ"), file("System monitoring", "199ST1hMGrXzqj0y-v_GGFq2zVjykf3lP"), file("User and group management", "1GU5DOwX2ZSEoHqkY8PKeo2VafqOZUcnt"),
          ],
        },
        {
          id: "git", number: "04", category: "Source Control", title: "Version Control (Git & GitHub)", accent: "#f97316", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/git/git-original.svg",
          description: "Learn the everyday Git workflow, collaboration patterns, branching strategies, and practical GitHub habits.",
          lessons: [file("Git introduction and fundamentals", "1GKupWL6Jxw92l9mjALXBKmhGWIpzz8DZ"), file("Git merge conflict, branching and strategies", "1pOPTvyXem8vLpHy374bOJn4POiTaJQwr"), file("GitHub pull request", "1VSH95x0pObbzlvEDKnxwN7NhZ9ibHadQ"), file("GitHub workflow", "1mGAAMQZHjrVbrDVnRRAcgEJHmV9kJZKm")],
        },
        {
          id: "ci", number: "05", category: "Automation", title: "Continuous Integration (CI)", accent: "#d946ef", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/jenkins/jenkins-original.svg",
          description: "Connect source control to repeatable builds, test automation, Jenkins pipelines, and GitHub Actions workflows.",
          lessons: [file("Basic Nginx deployment in Jenkins", "1Rb6yNpsBTdE_g10MY8r-ONCPPZdUJQZW"), file("GitHub Actions 1", "1QVZeisH6IezzhdFGqDa_tPfessWa88_J"), file("GitHub Actions 2 and 3", "1t2wX_z6Ya7Nu6oH4-VTmCu2ULJ1vi6ea"), file("GitHub Actions SCP", "1CAdVTQAipbrH6LDsnzFqnmYLJcsFbF_r"), file("GitHub repository creation", "1vhKO640G3x9WpHElwyAsfGG5i5kuMWtZ"), file("Gradle part 1", "1z1AD108FPIATqKbPJrtCtSpCRewS5Cd6"), file("Gradle part 2 and RBAC", "1cihBp3G05CJvhJbdI3xfhMYgArnLokiM"), file("Jenkins agents over SSH", "1G3tjgzVFe9z229P-GZ6D-Rnf2aqcxfvD"), file("Jenkins agents", "1FLRsC2HYnPkFQ7xuzWrUINl3jpMB8s-5"), file("Jenkins distributed architecture", "1OVWLi5IOn8Fpl5o46tBnE2kyZ9TncuF9"), file("Jenkins introduction and freestyle", "1WzFGde6edCpV-vH9AnUR3N1YdSKbReEh"), file("Jenkins pipeline", "1OhCILLG438ySnf3tX-nvu40PEJrgUL2L"), file("Maven Jenkins integration", "1Eprr_9TZPupWkTtFmrFGDgcFdb9duw3O"), file("Maven manual", "1QGDP2Z5QRRmMFPqFenB33wrYFEn-LSKM"), file("RBAC part 2 and pipeline stage view", "1o7fWSipbu_EnqmRTGwmYzZ2QRnO_lXEe")],
        },
        {
          id: "containers", number: "06", category: "Runtime", title: "Containers & Containerization", accent: "#2496ed", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/docker/docker-original.svg",
          description: "Understand container images, lifecycle, networking, storage, Compose, and daemonless alternatives.",
          lessons: [file("Docker volumes", "181zzWUGwWioYAXUBl3G_f2hTmXTCs6-i"), file("Docker fundamentals", "1YzxHoZSB6DNDOkoofp1sHJ24Ok27fDFK"), file("Docker Jenkins automation", "1nHbwfArFO0hb5Us7Zpmfavq4LpFLWeyJ"), file("Docker networking", "1YQg-BKyX99i1n9AbTMOrjMKQ8ZJBxkPc"), file("Docker storage", "14O4qPiFk1RtY00thK_YVfIdsNFeYixGy"), file("Docker Compose", "1BbooMOPjNhScijWyvoMzMyKLJR5mcaP1"), file("Dockerfile", "1lJ9EfYFie7-gxVriz4t8HDcCwJuG_uOv"), file("Podman and Buildah", "1jVbITFUbhtviDQw26eEvy2gIquoDYHC6")],
        },
        {
          id: "kubernetes", number: "07", category: "Orchestration", title: "Container Orchestration", accent: "#326ce5", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/kubernetes/kubernetes-plain.svg",
          description: "Move from one container to reliable clusters with Kubernetes workloads, services, configuration, and packaging.",
          lessons: [file("DaemonSets and ConfigMaps", "17uixDVvlAEo68azcj8qnWs2_qKayWFc9"), file("Deployments and rolling updates", "1rbsrx_-j3mfnKj0bnDEJCo_hgBXy78YK"), file("Helm and Kustomize", "1SoMg3pOASxuRxuDV-_7UB-PAa_c-Pq--"), file("Ingress", "1LLwABeDGTfFVCzyjLwzUjDJXIZcwFlyv"), file("Kubeadm", "1YV_BFXKunqF96pZVcmxfbVBb7DHg9r5E"), file("Kubernetes cluster architecture", "1ktvmAZe2A6MjrzIrwoaug4LtrwlEPVHz"), file("Kubernetes introduction", "1swBPp9_DIqOF6lH3ZzRWHN98W-clcdCe"), file("Minikube and kind", "16gtgxhJ3nKK-iFifrbhdN7qTMk0db1F2"), file("Namespaces and pods", "16H0rjhoPQthE_igNF-TV6L9bNn7sRyCf"), file("PV, PVC and StorageClass", "1IZkx_npQ1qZgOHYlvfk4324uqfHMNw_t"), file("ReplicaSets", "1fU5pXkqH3SlLYjwPWVGyqIOz6stVmgDK"), file("Secrets", "1iBeZiCJqopjWeZ2d6Z_-P8SOhlPl9K0S"), file("Services", "1kgDL3ZxrcT1RUVT7uc0Jgdp5ZQ0NG06c")],
        },
        {
          id: "terraform", number: "08", category: "Infrastructure", title: "Infrastructure as Code (IaC)", accent: "#844fba", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/terraform/terraform-original.svg",
          description: "Turn infrastructure into repeatable, reviewable configuration with Terraform providers, state, and modules.",
          lessons: [file("Terraform modules", "1wG0Z4bNPmkUpZoKU5WgFPyb6MjGnz9ZZ"), file("Terraform using Jenkins and IAM roles", "1arwDPG8gkf4NScpnovQCq2iEhvqVj5Bs"), file("Terraform EC2", "1e5IX9jYksjaivBTuNQGfrjQNy3BWGnWz"), file("Terraform introduction and S3 automation", "1rcJbZn2Nf9z_1OVyRpgnGP9LpCruwB4d")],
        },
        {
          id: "delivery", number: "10", category: "GitOps", title: "Continuous Delivery & Deployment", accent: "#ef4444", icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/argocd/argocd-original.svg",
          description: "Ship with confidence using progressive delivery patterns, GitOps workflows, and Kubernetes deployment automation.",
          lessons: [file("ArgoCD project", "14FD7dTGRTpOCZjdKLgklsM0VYUhDJAfA"), file("ArgoCD", "1ZzXLN6mfapRzh7FMj0Y079z45jr0kTfw"), file("Deployment strategies 2", "19dgLz95aS__SMA8cj58aYpcEPD3StaPV"), file("Deployment strategies", "1y6DMwIYnGAjva7hkJnAub2kmNXlgmNF8")],
        },
      ];

      const scalevoMark = (cls = "h-10 w-10") => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="${cls}" role="img" aria-label="Scalevo"><defs><linearGradient id="scalevoMonogramInline" x1="12" y1="12" x2="53" y2="54" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset=".52" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><path d="M49 14c-5-5-13-6-20-3l-9 4c-6 3-7 10-2 14 3 3 8 4 13 3l5-1c5-1 9 1 9 5 0 3-3 6-7 8l-9 4c-7 3-14 1-18-4" fill="none" stroke="url(#scalevoMonogramInline)" stroke-linecap="round" stroke-linejoin="round" stroke-width="7"/><path d="m34 34 8 16 11-24" fill="none" stroke="#172033" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"/></svg>`;
      const sortModules = (items) => [...items].sort((a, b) => {
        const numberA = Number.parseInt(a.number, 10); const numberB = Number.parseInt(b.number, 10);
        return (Number.isNaN(numberA) ? Number.MAX_SAFE_INTEGER : numberA) - (Number.isNaN(numberB) ? Number.MAX_SAFE_INTEGER : numberB) || String(a.title).localeCompare(String(b.title));
      });
      modules = sortModules(modules);
      const app = document.querySelector("#app");
      const toast = document.querySelector("#toast");
      const state = { view: "home", moduleId: null, adminModuleId: modules[0]?.id || "", adminDocTopic: "", query: "", player: null, authReady: false, authUser: null, googleClientId: "", adminUsers: [], adminAccessRequests: [], totalLessons: 0, loginMode: "candidate" };
      let completed = [];
      let dragState = null;

      const icon = (name, cls = "h-4 w-4") => `<i data-lucide="${name}" class="${cls}" aria-hidden="true"></i>`;
      const escapeHtml = (value = "") => String(value).replace(/[&<>'"]/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
      const slugify = (value) => value.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || `module-${Date.now()}`;
      const extractDriveId = (value) => {
        const input = value.trim();
        const match = input.match(/\/d\/([a-zA-Z0-9_-]+)/) || input.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        return match ? match[1] : input;
      };
      const allLessons = () => modules.flatMap((m) => m.lessons.map((lesson) => ({ ...lesson, moduleId: m.id })));
      const availableLessons = () => allLessons().filter((lesson) => lesson.ready);
      const isComplete = (lesson) => completed.includes(`${lesson.moduleId}:${lesson.title}`);
      const moduleProgress = (module) => {
        const done = module.lessons.filter((lesson) => isComplete({ ...lesson, moduleId: module.id })).length;
        return { done, total: module.lessons.length, ready: module.lessons.filter((lesson) => lesson.ready).length };
      };
      const titleCase = (value) => value.replace(/\b\w/g, (char) => char.toUpperCase());

      function footer() {
        return `<footer class="mx-auto mt-4 max-w-7xl border-t border-slate-200/80 px-5 py-8 sm:px-8 lg:px-10"><div class="flex flex-col justify-between gap-3 text-xs text-slate-400 sm:flex-row sm:items-center"><p>Scalevo · Focused DevOps learning, one recording at a time.</p>${state.authUser ? `<div class="flex items-center gap-4"><span>Course workspace</span>${state.authUser.role === "admin" ? '<button class="focus-ring font-semibold text-slate-500 transition hover:text-slate-900" data-open-dashboard>Dashboard</button>' : ""}<button class="focus-ring font-semibold text-slate-500 transition hover:text-slate-900" data-logout>Sign out</button></div>` : ""}</div></footer>`;
      }

      function header() {
        return `<header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/72 backdrop-blur-xl"><div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 sm:px-8 lg:px-10">
          <button class="focus-ring flex items-center gap-3 text-left" data-action="home" aria-label="Go to Scalevo learning workspace">${scalevoMark("h-10 w-10 shrink-0 sm:h-11 sm:w-11")}<span><span class="brand-wordmark block text-lg font-extrabold text-slate-900 sm:text-xl">Scalevo</span><span class="hidden text-[10px] font-semibold uppercase tracking-[.18em] text-slate-400 sm:block">DevOps learning workspace</span></span></button>
          <div class="flex items-center gap-3"><button class="focus-ring inline-flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-700 sm:hidden" data-toggle-mobile-nav aria-expanded="false" aria-label="Open navigation">${icon("menu", "h-5 w-5")}</button><span class="hidden rounded-full border border-slate-200 bg-white/70 px-3 py-2 text-xs font-semibold text-slate-500 sm:inline-flex">${availableLessons().length} unlocked recordings</span><span class="hidden text-xs font-semibold text-slate-500 sm:inline">${escapeHtml(state.authUser?.name || "")}</span><span class="hidden h-2 w-2 rounded-full bg-emerald-500 shadow-[0_0_0_4px_rgba(16,185,129,.12)] sm:block" title="Workspace online"></span></div>
        </div></header><div id="mobile-nav" class="hidden border-b border-slate-200 bg-white px-5 py-3 shadow-sm sm:hidden"><div class="mx-auto flex max-w-7xl flex-col gap-2 text-sm font-bold text-slate-700"><button class="focus-ring rounded-xl px-3 py-2 text-left hover:bg-slate-50" data-action="home">Learning dashboard</button>${state.authUser?.role === "admin" ? '<button class="focus-ring rounded-xl px-3 py-2 text-left hover:bg-slate-50" data-open-dashboard>Admin dashboard</button>' : ""}<button class="focus-ring rounded-xl px-3 py-2 text-left text-rose-600 hover:bg-rose-50" data-logout>Sign out</button></div></div>`;
      }
      function loginView() {
        return `<main class="flex min-h-screen items-center justify-center px-4 py-8 sm:px-8 sm:py-10"><section class="w-full max-w-5xl overflow-hidden rounded-[1.75rem] border border-slate-200/80 bg-white/80 shadow-float backdrop-blur-xl"><div class="grid lg:grid-cols-[.9fr_1.1fr]"><div class="bg-slate-950 px-6 py-9 text-white sm:px-10 sm:py-12">${scalevoMark("h-14 w-14 sm:h-16 sm:w-16")}<p class="mt-9 text-xs font-extrabold uppercase tracking-[.2em] text-blue-300">Scalevo learning workspace</p><h1 class="display mt-3 text-4xl font-extrabold leading-tight tracking-[-.05em] sm:text-5xl">Learn one focused recording at a time.</h1><p class="mt-5 max-w-md text-sm leading-7 text-slate-300">Sign in to watch sessions and keep your progress synced across your learning journey.</p><div class="mt-9 space-y-3 text-sm text-slate-300"><div class="flex items-center gap-3">${icon("shield-check", "h-4 w-4 text-emerald-400")} Secure account access</div><div class="flex items-center gap-3">${icon("bar-chart-3", "h-4 w-4 text-blue-300")} Progress saved to your profile</div></div></div><div class="px-6 py-8 sm:px-12 sm:py-12"><div class="flex gap-2 rounded-xl bg-slate-100 p-1"><button class="focus-ring flex-1 rounded-lg px-3 py-2 text-xs font-extrabold ${state.loginMode === "candidate" ? "bg-white text-slate-950 shadow-sm" : "text-slate-500"}" data-login-mode="candidate">Candidate login</button><button class="focus-ring flex-1 rounded-lg px-3 py-2 text-xs font-extrabold ${state.loginMode === "admin" ? "bg-white text-slate-950 shadow-sm" : "text-slate-500"}" data-login-mode="admin">Admin login</button></div>${state.loginMode === "candidate" ? `<div class="mt-8"><p class="text-xs font-extrabold uppercase tracking-[.18em] text-blue-600">Candidate access</p><h2 class="display mt-2 text-2xl font-extrabold tracking-[-.04em] text-slate-950">Continue with Gmail</h2><p class="mt-3 text-sm leading-6 text-slate-500">Use your Gmail account, then confirm your full name and phone number so your learning progress can be identified.</p><form data-candidate-form class="mt-6 space-y-4"><label class="block text-xs font-bold text-slate-600">Full name<input required name="name" class="focus-ring mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-medium text-slate-800 outline-none" placeholder="Your full name" /></label><label class="block text-xs font-bold text-slate-600">Phone number<input required name="phone" type="tel" class="focus-ring mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-medium text-slate-800 outline-none" placeholder="Your phone number" /></label><div class="border-t border-slate-100 pt-5"><p class="mb-3 text-xs font-semibold text-slate-400">Authentication is handled by Google. Only verified Gmail accounts can continue.</p><div id="google-login" class="flex min-h-[48px] items-center justify-center rounded-xl border border-slate-200 bg-white p-2"></div></div></form></div>` : `<div class="mt-8"><p class="text-xs font-extrabold uppercase tracking-[.18em] text-violet-600">Private access</p><h2 class="display mt-2 text-2xl font-extrabold tracking-[-.04em] text-slate-950">Administrator sign in</h2><p class="mt-3 text-sm leading-6 text-slate-500">Use the administrator credentials to manage modules, videos, titles, descriptions, and candidate progress.</p><form data-admin-login class="mt-6 space-y-4"><label class="block text-xs font-bold text-slate-600">Username<input required name="username" autocomplete="username" class="focus-ring mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-medium text-slate-800 outline-none" placeholder="Admin username" /></label><label class="block text-xs font-bold text-slate-600">Password<input required name="password" type="password" autocomplete="current-password" class="focus-ring mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm font-medium text-slate-800 outline-none" placeholder="Admin password" /></label><button class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-slate-950 px-4 py-3 text-sm font-extrabold text-white transition hover:bg-violet-600" type="submit">${icon("lock-keyhole", "h-4 w-4")} Open admin workspace</button></form></div>`}</div></div></section></main>`;
      }

      function homeView() {
        const filtered = modules.filter((module) => `${module.title} ${module.category}`.toLowerCase().includes(state.query.toLowerCase()));
        const indexed = availableLessons().length;
        return `${header()}<main class="mx-auto max-w-7xl px-5 pb-16 sm:px-8 lg:px-10"><section class="relative overflow-hidden py-12 sm:py-16"><div class="relative max-w-3xl"><div class="mb-5 inline-flex items-center gap-2 rounded-full border border-blue-100 bg-blue-50/70 px-3 py-1.5 text-[10px] font-extrabold uppercase tracking-[.2em] text-blue-600">${icon("sparkles", "h-3 w-3")} Your learning path</div><h1 class="display max-w-3xl text-4xl font-extrabold leading-[1.08] tracking-[-.05em] text-slate-950 sm:text-6xl">Learn DevOps in focused, <span class="text-blue-600">playable sessions.</span></h1><p class="mt-6 max-w-2xl text-base leading-7 text-slate-500 sm:text-lg">A private-feeling course workspace for moving from Linux fundamentals to production-grade delivery, one recording at a time.</p></div><div class="mt-9 grid max-w-2xl grid-cols-3 gap-3"><div class="glass rounded-2xl p-4"><p class="text-2xl font-extrabold text-slate-950">${modules.length}</p><p class="mt-1 text-[11px] font-semibold uppercase tracking-[.12em] text-slate-400">Modules</p></div><div class="glass rounded-2xl p-4"><p class="text-2xl font-extrabold text-slate-950">${indexed}</p><p class="mt-1 text-[11px] font-semibold uppercase tracking-[.12em] text-slate-400">Unlocked videos</p></div><div class="glass rounded-2xl p-4"><p class="text-2xl font-extrabold text-slate-950">${completed.length}</p><p class="mt-1 text-[11px] font-semibold uppercase tracking-[.12em] text-slate-400">Completed</p></div></div></section><section><div class="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-end"><div><p class="text-xs font-extrabold uppercase tracking-[.2em] text-blue-600">Course library</p><h2 class="display mt-1 text-2xl font-extrabold tracking-[-.04em] text-slate-950">Choose a module</h2></div><label class="relative block w-full sm:w-64">${icon("search", "pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400")}<input data-search class="focus-ring w-full rounded-xl border border-slate-200 bg-white/75 py-2.5 pl-9 pr-3 text-sm text-slate-700 outline-none placeholder:text-slate-400" placeholder="Search modules" value="${state.query}" /></label></div><div class="grid grid-cols-1 gap-5 md:grid-cols-2 xl:grid-cols-3">${filtered.map(moduleCard).join("")}</div></section></main>`;

      function moduleCard(module) {

span></div></button>`;

      function markdownHtml(markdown) {

      }
      function moduleView(module) {

        const accessStatus = module.accessStatus || "locked";

        const content = unlocked ? `<section class="mt-9 grid grid-cols-1 gap-8 lg:grid-cols-[minmax(0,1fr)_300px]"><div><div class="mb-4 flex items-end justify-between"><div><p class="text-xs font-extrabold uppercase tracking-[.2em] text-blue-600">Lesson playlist</p><h2 class="display mt-1 text-2xl font-extrabold tracking-[-.04em] text-slate-950">Sessions in this module</h2></div><span class="text-xs font-semibold text-slate-400">${module.lessons.length} lessons</span></div><div class="space-y-3">${module.lessons.map((lesson, index) => lessonRow(module, lesson, index)).join("")}</div></div><aside class="glass h-fit rounded-[1.25rem] p-6"><p class="text-xs font-extrabold uppercase tracking-[.18em] text-slate-400">Study rhythm</p><h3 class="display mt-2 text-lg font-extrabold tracking-[-.03em] text-slate-950">Small sessions, real momentum.</h3><p class="mt-3 text-sm leading-6 text-slate-500">Watch a lesson, mark it complete, and return whenever you are ready for the next concept.</p><div class="mt-5 space-y-3 text-sm text-slate-600"><div class="flex items-center gap-3">${icon("play-circle", "h-4 w-4 text-blue-600")} Play inside the workspace</div><div class="flex items-center gap-3">${icon("check-circle-2", "h-4 w-4 text-emerald-600")} Track your progress</div><div class="flex items-center gap-3">${icon("bookmark", "h-4 w-4 text-violet-600")} Pick up where you left off</div></div></aside></section>` : `<section class="mt-9"><div class="glass mx-auto max-w-2xl rounded-[1.5rem] p-8 text-center sm:p-12"><span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">${icon(accessStatus === "pending" ? "clock-3" : accessStatus === "denied" ? "shield-x" : "lock-keyhole", "h-7 w-7")}</span><p class="mt-6 text-xs font-extrabold uppercase tracking-[.2em] text-blue-600">Module access</p><h2 class="display mt-2 text-2xl font-extrabold tracking-[-.04em] text-slate-950">${accessStatus === "pending" ? "Approval is on its way" : accessStatus === "denied" ? "Access was not approved" : "Unlock this module"}</h2><p class="mx-auto mt-4 max-w-md text-sm leading-7 text-slate-500">${accessCopy}</p>${accessStatus === "pending" ? `<div class="mt-6 inline-flex items-center gap-2 rounded-full bg-amber-50 px-4 py-2 text-xs font-bold text-amber-700">${icon("hourglass", "h-4 w-4")} Waiting for admin review</div>` : `<button class="mt-7 inline-flex items-center gap-2 rounded-xl bg-slate-950 px-5 py-3 text-sm font-extrabold text-white transition hover:bg-blue-600" data-request-access="${module.id}">${icon("key-round", "h-4 w-4")} Request module access</button>`}</div></section>`;

ontent}</main>`;

      function lessonRow(module, lesson, index) {

        return `<div class="lesson-row flex items-center gap-4 rounded-2xl border border-slate-200/80 bg-white/75 p-4 sm:p-5"><span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl text-xs font-extrabold" style="background:color-mix(in srgb, ${module.accent} 10%, white);color:${module.accent}">${String(index + 1).padStart(2, "0")}</span><div class="min-w-0 flex-1"><h3 class="truncate text-sm font-bold text-slate-900 sm:text-base">${titleCase(lesson.title)}</h3><p class="mt-1 text-xs font-medium text-slate-400">${lesson.ready ? "Recording available" : "Lesson mapped · video being indexed"}</p></div><button class="focus-ring inline-flex shrink-0 items-center gap-2 rounded-xl px-3 py-2 text-xs font-extrabold transition ${lesson.ready ? "bg-slate-950 text-white hover:bg-blue-600" : "cursor-not-allowed bg-slate-100 text-slate-400"}" ${lesson.ready ? `data-play="${module.id}|${index}"` : "disabled"}>${lesson.ready ? icon("play", "h-3.5 w-3.5 fill-current") + " Watch" : "Soon"}</button><button class="focus-ring flex h-8 w-8 shrink-0 items-center justify-center rounded-full border transition ${done ? "border-emerald-200 bg-emerald-50 text-emerald-600" : "border-slate-200 text-slate-300 hover:border-slate-300 hover:text-slate-500"}" data-complete="${module.id}|${index}" aria-label="${done ? "Mark incomplete" : "Mark complete"}">${icon(done ? "check" : "circle", "h-4 w-4")}</button></div>`;

v></div>`).join("") : `<div class="rounded-xl border border-dashed border-slate-200 px-4 py-6 text-center text-sm font-medium text-slate-400">No pending module access requests.</div>`}</div></section>`;

="number" class="focus-ring mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-medium text-slate-800 outline-none" placeholder="09" /></label><label class="text-xs font-bold text-slate-600">Category<input name="category" class="focus-ring mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-medium text-slate-800 outline-none" placeholder="Monitoring" /></label><label class="col-span-2 text-xs font-bold text-slate-600">Logo URL<input required name="icon" type="url" class="focus-ring mt-2 w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-medium text-slate-800 outline-none" placeholder="https://.../logo.svg" /></label><label class="col-span-2 text-xs font-bold text-slate-600">Short description<textarea name="description" rows="3" class="focus-ring mt-2 w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-medium text-slate-800 outline-none" placeholder="What will learners build or understand?"></textarea></label></div><button class="mt-5 inline-flex items-center gap-2 rounded-xl bg-slate-950 px-4 py-3 text-sm font-extrabold text-white transition hover:bg-blue-600" type="submit">${icon("plus", "h-4 w-4")} Add module</button></form>${selected ? `<form data-module-edit class="glass rounded-[1.25rem] p-6 sm:p-7"><div class="flex items-start justify-between gap-4"><div><p class="text-xs font-extrabold uppercase tracking-[.18em] text-slate-400">Edit module</p><h2 class="display mt-1 text-xl font-extrabold tracking-[-.04em] text-slate-950">${escapeHtml(selected.title)}</h2></div><button type="button" class="focus-ring text-xs font-bold text-rose-500 hover:text-rose-700" data-delete-module="${selected.id}">${icon("trash-2", "inline h-3.5 w-3.5")} Delete module</button></div><div class="mt-6 grid grid-cols-2 gap-4"><label class="col-span-2 text-xs font-bold text-slate-600">Module name<input required name="title" value="${escapeHtml(selected.title)}" class="focus         if (event.target.matches("[data-video-edit]")) {
          event.preventDefault(); const form = new FormData(event.target); const [moduleId, lessonId] = event.target.dataset.videoEdit.split("|"); const driveId = extractDriveId(String(form.get("videoLink") || ""));
          try { await request(`/api/admin/modules/${moduleId}/lessons/${lessonId}`, { method: "PATCH", body: JSON.stringify({ title: form.get("videoTitle"), driveId }) }); await loadWorkspace(); showToast("Video updated"); } catch (error) { showToast(error.message); } return;
        }
        if (event.target.matches("[data-module-form]")) {
          event.preventDefault();
          const form = new FormData(event.target);
          const title = String(form.get("title") || "").trim();
          let id = slugify(title);
          while (modules.some((module) => module.id === id)) id = `${slugify(title)}-${Date.now()}`;
          const module = { id, number: String(form.get("number") || "").trim(), category: String(form.get("category") || "General").trim(), title, accent: "#3568f5", icon: String(form.get("icon") || "").trim(), description: String(form.get("description") || "").trim() || "A new learning module in the DevOps path." };
          try { await request("/api/admin/modules", { method: "POST", body: JSON.stringify(module) }); state.adminModuleId = id; await loadWorkspace(); showToast("Module added to the workspace"); } catch (error) { showToast(error.message); } return;
        }
        if (event.target.matches("[data-video-form]")) {
          event.preventDefault();
          const form = new FormData(event.target);
          const title = String(form.get("videoTitle") || "").trim();
          const id = extractDriveId(String(form.get("videoLink") || ""));
          const module = modules.find((item) => item.id === state.adminModuleId);
          if (!module || !title || id.length < 10) { showToast("Enter a video name and a valid Drive link or file ID"); return; }
          try { await request(`/api/admin/modules/${state.adminModuleId}/lessons`, { method: "POST", body: JSON.stringify({ title, driveId: id }) }); await loadWorkspace(); showToast("Video added to playlist"); } catch (error) { showToast(error.message); }
        }
      });
      document.addEventListener("input", (event) => { if (event.target.matches("[data-search]")) { state.query = event.target.value; render(); const input = document.querySelector("[data-search]"); if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); } } });
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") closePlayer(); });
      render();
      loadWorkspace();
    </script>
  </body>
</html>
