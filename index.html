        const batchDecision = event.target.closest("[data-batch-decision]"); if (batchDecision) { const [requestId, status] = batchDecision.dataset.batchDecision.split("|"); try { await request(`/api/admin/batch-requests/${requestId}`, { method: "PATCH", body: JSON.stringify({ status }) }); await loadWorkspace(); navigate("/admin/batch-requests"); showToast(status === "approved" ? "Batch access approved" : "Batch request denied"); } catch (error) { showToast(error.message); } return; }
        const batchSelect = event.target.closest("[data-batch-select]"); if (batchSelect) { state.adminBatchId = batchSelect.dataset.batchSelect; }
        const deleteModule = event.target.closest("[data-delete-module]"); if (deleteModule) { if (confirm("Delete this module and all its videos?")) { await request(`/api/admin/modules/${deleteModule.dataset.deleteModule}`, { method: "DELETE" }); state.adminModuleId = ""; await loadWorkspace(); showToast("Module deleted"); } return; }
        const deleteBatch = event.target.closest("[data-delete-batch]"); if (deleteBatch) { if (confirm("Delete this batch and its requests?")) { await request(`/api/admin/batches/${deleteBatch.dataset.deleteBatch}`, { method: "DELETE" }); state.adminBatchId = null; await loadWorkspace(); navigate("/admin/batches"); showToast("Batch deleted"); } return; }
        const deleteUser = event.target.closest("[data-delete-user]"); if (deleteUser) { const name = deleteUser.dataset.userName || "this learner"; const email = deleteUser.dataset.userEmail || ""; if (!confirm(`Permanently delete ${name}${email ? ` (${email})` : ""}? This also removes their sessions, progress, and access requests.`)) return; try { await request(`/api/admin/users/${encodeURIComponent(deleteUser.dataset.deleteUser)}`, { method: "DELETE" }); await loadWorkspace(); navigate("/admin/users"); showToast("Learner account deleted"); } catch (error) { showToast(error.message); } return; }
        const moveLessonButton = event.target.closest("[data-move-lesson]"); if (moveLessonButton) { const [moduleId, lessonId, direction] = moveLessonButton.dataset.moveLesson.split("|"); await moveLesson(moduleId, lessonId, direction); return; }
        const removeVideo = event.target.closest("[data-remove-video]"); if (removeVideo) { const [moduleId, index] = removeVideo.dataset.removeVideo.split("|"); const module = modules.find((item) => item.id === moduleId); const lesson = module?.lessons[Number(index)]; if (lesson?.lessonId) { await request(`/api/admin/modules/${moduleId}/lessons/${lesson.lessonId}`, { method: "DELETE" }); await loadWorkspace(); showToast("Video removed from playlist"); } return; }
        const documentToggle = event.target.closest("[data-document-toggle]"); if (documentToggle) { const panel = document.getElementById(documentToggle.getAttribute("aria-controls")); if (!panel) return; const expanded = documentToggle.getAttribute("aria-expanded") === "true"; const nextExpanded = !expanded; documentToggle.setAttribute("aria-expanded", String(nextExpanded)); documentToggle.setAttribute("aria-label", `${nextExpanded ? "Hide" : "Show"} document for ${documentToggle.dataset.documentTitle}`); panel.hidden = !nextExpanded; documentToggle.querySelector("[data-document-chevron]")?.classList.toggle("rotate-180", nextExpanded); return; }
        const moduleTab = event.target.closest("[data-module-tab]"); if (moduleTab) { state.moduleTabs[moduleTab.dataset.moduleId] = moduleTab.dataset.moduleTab; render(); return; }
        const addSyllabus = event.target.closest("[data-add-syllabus]"); if (addSyllabus) { const form = addSyllabus.closest("form"); const list = form?.querySelector("[data-syllabus-list]"); if (list) { list.insertAdjacentHTML("beforeend", syllabusRowMarkup({}, list.children.length)); refreshSyllabusPositions(list); list.querySelector("[data-syllabus-row]:last-child [data-syllabus-title]")?.focus(); } return; }
        const removeSyllabus = event.target.closest("[data-remove-syllabus]"); if (removeSyllabus) { const row = removeSyllabus.closest("[data-syllabus-row]"); const list = row?.parentElement; const slug = row?.querySelector("[data-syllabus-slug]")?.value; const title = row?.querySelector("[data-syllabus-title]")?.value || "this chapter"; if (slug && !confirm(`Remove “${title}” from the syllabus and delete its document?`)) return; row?.remove(); if (list) refreshSyllabusPositions(list); return; }
        const moveSyllabus = event.target.closest("[data-move-syllabus]"); if (moveSyllabus) { const row = moveSyllabus.closest("[data-syllabus-row]"); const list = row?.parentElement; if (!row || !list) return; if (moveSyllabus.dataset.moveSyllabus === "up" && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling); if (moveSyllabus.dataset.moveSyllabus === "down" && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row); refreshSyllabusPositions(list); return; }

      document.addEventListener("change", (event) => { if (event.target.matches("[data-admin-module]")) { state.adminModuleId = event.target.value; state.adminDocTopic = ""; render(); } if (event.target.matches("[data-admin-batch]")) { state.adminBatchId = event.target.value; render(); } if (event.target.matches("[data-admin-doc-topic]")) { state.adminDocTopic = event.target.value; render(); } });

      document.addEventListener("dragstart", (event) => { const row = event.target.closest("[data-lesson-drag]"); if (!row || state.authUser?.role !== "admin") return; dragState = { moduleId: row.dataset.moduleId, lessonId: row.dataset.lessonId }; row.classList.add("opacity-45"); event.dataTransfer.effectAllowed = "move"; event.dataTransfer.setData("text/plain", row.dataset.lessonId); });
      document.addEventListener("dragover", (event) => { const row = event.target.closest("[data-lesson-drag]"); if (!row || !dragState || row.dataset.moduleId !== dragState.moduleId) return; event.preventDefault(); event.dataTransfer.dropEffect = "move"; row.classList.add("border-blue-400", "bg-blue-50/60"); });
      document.addEventListener("dragleave", (event) => { const row = event.target.closest("[data-lesson-drag]"); if (row) row.classList.remove("border-blue-400", "bg-blue-50/60"); });
      document.addEventListener("drop", async (event) => { const target = event.target.closest("[data-lesson-drag]"); if (!target || !dragState || target.dataset.moduleId !== dragState.moduleId) return; event.preventDefault(); const module = modules.find((item) => item.id === dragState.moduleId); const from = module?.lessons.findIndex((lesson) => String(lesson.lessonId) === String(dragState.lessonId)); const to = module?.lessons.findIndex((lesson) => String(lesson.lessonId) === String(target.dataset.lessonId)); if (!module || from < 0 || to < 0 || from === to) { dragState = null; return; } const [moved] = module.lessons.splice(from, 1); module.lessons.splice(to, 0, moved); dragState = null; render(); try { await persistLessonOrder(module.id, module.lessons.map((lesson) => lesson.lessonId)); showToast("Video order updated"); } catch (error) { await loadWorkspace(); showToast(error.message); } });

          try { await request(`/api/admin/modules/${encodeURIComponent(state.adminModuleId)}`, { method: "PATCH", body: JSON.stringify({ title: form.get("title"), number: form.get("number"), category: form.get("category"), icon: form.get("icon"), description: form.get("description"), accent: module?.accent, chapters }) }); await loadWorkspace(); navigate("/admin/modules/edit"); showToast("Module and syllabus updated"); } catch (error) { showToast(error.message); } return;

          try { await request(`/api/admin/modules/${moduleId}/lessons/${lessonId}`, { method: "PATCH", body: JSON.stringify({ title: form.get("videoTitle"), driveId }) }); await loadWorkspace(); showToast("Video updated"); } catch (error) { showToast(error.message); } return;

          try { await request("/api/admin/modules", { method: "POST", body: JSON.stringify(module) }); state.adminModuleId = id; await loadWorkspace(); navigate("/admin/modules/edit"); showToast("Module and syllabus added to the workspace"); } catch (error) { showToast(error.message); } return;
